<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>所有世界 · 无限物语</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#322e28;font:16px/1.7 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1280px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid #dcd4c8}a{color:#80613d;text-decoration:none}h1{font:34px/1.3 "SimSun",serif;margin:32px 0 10px}p{color:#7d756b}.tools{display:flex;gap:12px;margin:22px 0;align-items:center;flex-wrap:wrap}select,input,button{font:inherit;padding:9px 14px;border:1px solid #d5cabb;background:#fcfaf6;color:#514639;border-radius:4px}button{cursor:pointer}button:hover{background:#e9e0d3}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.card{background:#fcfaf6;border:1px solid #e0d7ca;border-radius:5px;overflow:hidden}.cover{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}.info{padding:16px}.info h2{font-size:19px;margin:0}.meta{font-size:13px;color:#91836f;margin:6px 0 14px}.actions{display:flex;justify-content:space-between;gap:8px}.actions button{font-size:14px}.picked{background:#554733;color:#fff}.thumbs{display:flex;gap:5px;margin:10px 0}.thumbs img{width:calc((100% - 10px)/3);aspect-ratio:16/10;object-fit:cover}dialog{max-width:1120px;width:94vw;height:90vh;padding:0;border:1px solid #d4cabb;border-radius:6px;background:#f4f1eb;color:#332d26}dialog::backdrop{background:#211d18bb}.dialoghead{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 22px;background:#f4f1eb;border-bottom:1px solid #d6ccbd}.dialoghead h2{font-size:21px;margin:0}.contents{padding:22px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0}figure img{width:100%;display:block;object-fit:contain;background:#eee7dd;cursor:zoom-in}.photos figcaption{font-size:13px;color:#867864;padding:8px 0}.sprites{grid-template-columns:repeat(5,1fr)}.sprites img{aspect-ratio:2/3}#lightbox{height:auto;max-height:94vh;background:#191714;width:auto;max-width:96vw}#lightbox img{display:block;max-width:94vw;max-height:85vh}#lightbox button{position:absolute;right:10px;top:10px}#count{color:#8b7b65;font-size:14px}button:focus-visible,a:focus-visible{outline:2px solid #a8875e;outline-offset:3px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sprites{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){main{padding:18px}.grid,.photos{grid-template-columns:1fr}.sprites{grid-template-columns:repeat(2,1fr)}input{width:100%}}
.portraitCover{object-fit:contain;background:#ece6dc}.thumbs img.portraitThumb{object-fit:contain;background:#ece6dc;aspect-ratio:3/4}</style></head><body><main><header><a href="index.html">无限物语</a><a href="index.html">返回演示 ↗</a></header><h1>所有世界</h1><p>精选世界展示 CG 与角色立绘，其余世界展示角色与表情。</p><div class="tools"><input id="search" placeholder="搜索世界名称" aria-label="搜索世界名称"><select id="lang" aria-label="语言"><option value="">全部语言</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文</option><option value="en">英语</option><option value="ja">日语</option></select><button id="only">只看已选</button><span id="count"></span></div><div class="grid" id="grid"></div><dialog id="detail"><div class="dialoghead"><h2 id="title"></h2><button id="close">关闭</button></div><div class="contents"><h3 id="cgHeading">CG</h3><div class="photos" id="cgs"></div><h3>角色与表情</h3><div class="photos sprites" id="sprites"></div></div></dialog><dialog id="lightbox"><button id="closeImage">关闭</button><img id="large" alt="大图"></dialog></main><script src="all-worlds.js"></script><script>
const $=id=>document.getElementById(id),langs={'zh-CN':'简体中文','zh-TW':'繁体中文',en:'英语',ja:'日语'};let selected;try{selected=new Set(JSON.parse(localStorage.getItem('infinite-world-picks')||'[]'))}catch{selected=new Set}let only=false;const featured=w=>['未闻花名的季节','春逝未满'].includes(w.title);ALL_WORLDS.sort((a,b)=>Number(featured(b))-Number(featured(a)));const portraits=w=>w.characters.filter(c=>c.title.endsWith(' · default')); 
function show(w){$('title').textContent=w.title;$('cgHeading').hidden=!featured(w);$('cgs').hidden=!featured(w);for(const[id,items]of [['cgs',featured(w)?w.cgs:[]],['sprites',w.characters]]){$(id).replaceChildren(...items.map(c=>{let f=document.createElement('figure'),im=new Image,cap=document.createElement('figcaption');im.src=c.src;im.alt=c.title;im.loading='lazy';cap.textContent=c.title;im.onclick=()=>{$('large').src=c.src;$('large').alt=c.title;$('lightbox').showModal()};f.append(im,cap);return f}))}$('detail').showModal();$('detail').scrollTop=0}
function render(){const list=ALL_WORLDS.filter(w=>(!$('lang').value||w.language===$('lang').value)&&w.title.includes($('search').value)&&(!only||selected.has(w.id)));$('count').textContent=`${list.length} 个世界 · 已选 ${selected.size}`;$('grid').replaceChildren(...list.map(w=>{let card=document.createElement('article');card.className='card';let im=new Image;im.className='cover';im.loading='lazy';im.alt=w.title;const images=featured(w)?w.cgs:portraits(w);if(images.length)im.src=images[0].src;if(!featured(w))im.classList.add('portraitCover');im.onclick=()=>show(w);let info=document.createElement('div');info.className='info';let h=document.createElement('h2');h.textContent=w.title;let meta=document.createElement('div');meta.className='meta';meta.textContent=`${langs[w.language]||w.language} · ${featured(w)?w.cgs.length+' 张 CG · ':''}${w.characters.length} 张立绘与表情`;let thumbs=document.createElement('div');thumbs.className='thumbs';(featured(w)?w.cgs.slice(1,4):portraits(w)).forEach(c=>{let x=new Image;x.src=c.src;x.alt=c.title;x.loading='lazy';if(!featured(w))x.classList.add('portraitThumb');x.onclick=()=>show(w);thumbs.append(x)});let actions=document.createElement('div');actions.className='actions';let open=document.createElement('button');open.textContent=featured(w)?'查看 CG 与角色':'查看角色立绘';open.onclick=()=>show(w);let pick=document.createElement('button');pick.textContent=selected.has(w.id)?'✓ 已选':'选择';pick.className=selected.has(w.id)?'picked':'';pick.onclick=()=>{selected.has(w.id)?selected.delete(w.id):selected.add(w.id);try{localStorage.setItem('infinite-world-picks',JSON.stringify([...selected]))}catch{}render()};actions.append(open,pick);info.append(h,meta,thumbs,actions);card.append(im,info);return card}))}
$('search').oninput=render;$('lang').onchange=render;$('only').onclick=()=>{only=!only;$('only').textContent=only?'显示全部':'只看已选';render()};$('close').onclick=()=>$('detail').close();$('closeImage').onclick=()=>$('lightbox').close();render();
</script></body></html>
